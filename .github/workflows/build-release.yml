name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read version from package.json
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Create and push tag
        id: tag
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $existing = git tag -l $tag
          if ($existing) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            git config user.email "action@github.com"
            git config user.name "GitHub Action"
            git tag $tag
            git push origin $tag
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build Windows executable
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Locate built artifact
        id: artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'dist') -Filter 'youtube-desktop.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'youtube-desktop.exe not found after build' }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-desktop-win.exe
          path: ${{ steps.artifact.outputs.path }}

  linux:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> $GITHUB_OUTPUT

      - name: Build Linux AppImage
        env:
          PLATFORM: linux
        run: |
          npm run build
          rm -rf dist/appimage && mkdir -p dist/appimage/usr/bin dist/appimage/usr/share/applications dist/appimage/usr/share/icons/hicolor/256x256/apps
          cp dist/youtube-desktop-linux-x64/youtube-desktop dist/appimage/usr/bin/
          cp -r dist/youtube-desktop-linux-x64/resources dist/appimage/usr/bin/
          cp dist/youtube-desktop-linux-x64/*.pak dist/appimage/usr/bin/ 2>/dev/null || true
          cp dist/youtube-desktop-linux-x64/icudtl.dat dist/appimage/usr/bin/ 2>/dev/null || true
          cp dist/youtube-desktop-linux-x64/libffmpeg.so dist/appimage/usr/bin/ 2>/dev/null || true
          cp dist/youtube-desktop-linux-x64/libvulkan.so.1 dist/appimage/usr/bin/ 2>/dev/null || true
          cp dist/youtube-desktop-linux-x64/libvk_swiftshader.so dist/appimage/usr/bin/ 2>/dev/null || true
          cp -r dist/youtube-desktop-linux-x64/locales dist/appimage/usr/bin/ 2>/dev/null || true
          cp dist/youtube-desktop-linux-x64/swiftshader dist/appimage/usr/bin/ -r 2>/dev/null || true
          cp dist/youtube-desktop-linux-x64/snapshot_blob.bin dist/appimage/usr/bin/ 2>/dev/null || true
          cp dist/youtube-desktop-linux-x64/v8_context_snapshot.bin dist/appimage/usr/bin/ 2>/dev/null || true
          cp dist/youtube-desktop-linux-x64/version dist/appimage/usr/bin/ 2>/dev/null || true
          cp dist/youtube-desktop-linux-x64/vk_swiftshader_icd.json dist/appimage/usr/bin/ 2>/dev/null || true
          cp .github/workflows/scripts/appimage-tpl/youtube-desktop.desktop dist/appimage/usr/share/applications/
          cp assets/icons/youtube-desktop-256.png dist/appimage/usr/share/icons/hicolor/256x256/apps/youtube-desktop.png
          cp .github/workflows/scripts/appimage-tpl/AppRun dist/appimage/AppRun
          chmod +x dist/appimage/AppRun
          cd dist/appimage && wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool && chmod +x appimagetool && ./appimagetool --no-appstream . ../youtube-desktop-linux-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-desktop-linux-x86_64.AppImage
          path: dist/youtube-desktop-linux-x86_64.AppImage

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: youtube-desktop-win.exe

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: youtube-desktop-linux-x86_64.AppImage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          name: Release v${{ needs.windows.outputs.version }}
          files: |
            ${{ github.workspace }}/youtube-desktop-win.exe
            ${{ github.workspace }}/youtube-desktop-linux-x86_64.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}