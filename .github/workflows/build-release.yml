name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read version from package.json
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Create and push tag
        id: tag
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $existing = git tag -l $tag
          if ($existing) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            git config user.email "action@github.com"
            git config user.name "GitHub Action"
            git tag $tag
            git push origin $tag
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build Windows executable
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Locate built artifact
        id: artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'dist') -Filter 'youtube-desktop.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'youtube-desktop.exe not found after build' }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: ${{ steps.artifact.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
